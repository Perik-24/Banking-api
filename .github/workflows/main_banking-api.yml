name: Build and deploy Python app to Azure Web App - Banking-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show Python info (debug)
        run: |
          python --version
          pip --version

      - name: Create virtual environment, force-install compatible numpy and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          # FORZAR numpy compatible antes de instalar el resto (evita numpy 2.x)
          pip install --force-reinstall --no-cache-dir numpy==1.24.4
          pip install --no-cache-dir -r requirements.txt
          # Mostrar versiones instaladas para debug
          pip show numpy
          pip show tensorflow-cpu || true
          pip show scikit-learn || true

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Show runtime.txt and files (debug)
        run: |
          echo "runtime.txt content:"
          cat runtime.txt || echo "runtime.txt not found"
          ls -la

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39253271356244C5864FEFB374B54C52 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_97F515A04AA84C66BD984057B9292DC7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B73E911F1A154B02AD192D58449C7EAE }}

      # Opcional: forzar que App Service use Python 3.10 cuando Oryx construya (si quieres fijarlo desde el workflow)
      # - name: Ensure SCM builds with Python 3.10 (set SCM_DO_BUILD_DURING_DEPLOYMENT=false to skip Oryx)
      #   run: |
      #     az webapp config appsettings set --resource-group YOUR_RG --name Banking-api --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Banking-api'
          slot-name: 'Production'